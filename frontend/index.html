<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Depo ve Lojistik Takip</title>

  <!-- PWA Manifest ve Tema Ayarları -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b5e76">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2897/2897785.png">

  <style>
    /* Genel Sıfırlama ve Temel Stiller */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1, h2, h3 {
      color: #1b5e76;
      margin-bottom: 15px;
    }

    /* Form ve Alan Düzenleri */
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      width: 100%;
    }

    /* Buton Grupları ve Tasarımı */
    .button-group, .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button, .btn {
      background-color: #1b5e76;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    button:hover, .btn:hover {
      background-color: #134355;
    }

    .btn-danger {
      background-color: #dc3545;
    }
    .btn-danger:hover {
      background-color: #bd2130;
    }

    /* Tablo Mimarisi */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #1b5e76;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* ==========================================
       MOBİL EKRAN UYUMLULUĞU (PWA / TELEFON)
       ========================================== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      /* Form elemanlarını ve butonları ekrana tam oturtur */
      .button-group, .actions, form {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        gap: 10px !important;
      }

      button, .btn {
        width: 100% !important;
        padding: 12px !important;
        font-size: 16px !important; /* Mobil basmayı kolaylaştırır */
        box-sizing: border-box !important;
      }

      /* Tablonun taşmasını engeller, kaydırılabilir yapar */
      .table-container {
        display: block !important;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Stok ve Lojistik Takip Paneli</h1>
    <p>Sistem aktif olarak çalışıyor.</p>
  </div>

  <!-- PWA Service Worker Kaydı -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
